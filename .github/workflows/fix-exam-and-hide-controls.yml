name: Fix Create Exam and hide disabled controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-exam-and-hide-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch teacher exam controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script id="exam-create-and-controls-final-fix">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script id="exam-controls-hide-only-v3">.*?</script>', '', s, flags=re.S)
          js=r'''<script id="exam-controls-final-v4">
          (function(){
            function n(x){return String(x||'').replace(/\s+/g,' ').trim().toLowerCase();}
            function hide(){
              document.querySelectorAll('button,a,[role="button"],.dash-action,.nav-item,.sidebar-item').forEach(function(el){
                var t=n(el.textContent);
                if(t==='attendance'||t==='الحضور'||t==='الغياب'||t==='الحضور والغياب'||t.includes('attendance & absence')||t.includes('attendance and absence')||t.includes('import pdf')||t.includes('pdf import')||t.includes('استيراد pdf')){
                  el.style.setProperty('display','none','important');
                }
              });
            }
            function openExam(){
              if(typeof window.openCreateExam==='function') return window.openCreateExam();
              var old=document.getElementById('cg-exam-box'); if(old) old.remove();
              var box=document.createElement('div'); box.id='cg-exam-box';
              box.style='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px';
              box.innerHTML='<div style="background:white;border-radius:16px;padding:20px;width:min(520px,100%)"><h2>Create Exam</h2><input id="cg-title" placeholder="Exam Title" style="width:100%;padding:12px;margin:6px 0"><select id="cg-grade" style="width:100%;padding:12px;margin:6px 0"><option value="">Unassigned</option><option>أولى إعدادي</option><option>ثانية إعدادي</option><option>ثالثة إعدادي</option><option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option><option>كورسات</option></select><input id="cg-duration" type="number" value="30" style="width:100%;padding:12px;margin:6px 0"><button id="cg-save" style="padding:12px;width:100%">Create Exam</button><button id="cg-close" style="padding:10px;width:100%;margin-top:6px">Cancel</button><div id="cg-msg" style="margin-top:8px"></div></div>';
              document.body.appendChild(box);
              cgClose.onclick=function(){box.remove()};
              cgSave.onclick=async function(){
                var title=cgTitle.value.trim(), grade=cgGrade.value, duration=Number(cgDuration.value||30);
                if(!title){cgMsg.textContent='Enter exam title';return;}
                if(typeof sb==='undefined'){cgMsg.textContent='Database connection unavailable';return;}
                cgMsg.textContent='Creating...';
                var r=await sb.rpc('teacher_create_exam',{p_title:title,p_grade:grade,p_duration_minutes:duration,p_show_answers:false});
                if(r.error || !r.data || r.data.success===false){cgMsg.textContent=(r.error&&r.error.message)||(r.data&&r.data.message)||'Failed';return;}
                cgMsg.textContent='Exam created successfully';
                setTimeout(function(){box.remove();if(typeof refreshTeacher==='function')refreshTeacher()},500);
              };
            }
            function wire(){
              hide();
              document.querySelectorAll('button,a,[role="button"],.dash-action').forEach(function(el){
                if(el.dataset.cgExam==='1')return;
                var t=n(el.textContent);
                if(t.includes('create exam')||t.includes('إنشاء امتحان')){
                  el.dataset.cgExam='1';
                  el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openExam()},false);
                }
              });
            }
            wire();
            new MutationObserver(wire).observe(document.documentElement,{childList:true,subtree:true});
            setTimeout(wire,300);setTimeout(wire,1000);setTimeout(wire,2500);
          })();
          </script>'''
          s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "chatgpt-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make Create Exam clickable"
          git push
