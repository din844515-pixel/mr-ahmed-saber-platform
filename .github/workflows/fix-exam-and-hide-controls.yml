name: Fix Create Exam and hide disabled controls
# Trigger a fresh run for the current production UI.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-exam-and-hide-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove broken Create Exam interception and hide disabled controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<script id="exam-create-and-controls-final-fix">')
          if start != -1:
              end=s.find('</script>', start)
              if end != -1:
                  s=s[:start]+s[end+9:]
          import re
          s=re.sub(r'<script id="exam-controls-hide-only-v2">.*?</script>', '', s, flags=re.S)
          js=r'''<script id="exam-controls-hide-only-v3">
          (function(){
            function clean(t){return (t||'').replace(/\s+/g,' ').trim().toLowerCase();}
            function hide(){
              document.querySelectorAll('button,a,[role="button"],.dash-action,.nav-item,.sidebar-item').forEach(function(el){
                var t=clean(el.textContent);
                if(t.includes('attendance & absence')||t.includes('attendance and absence')||t==='attendance'||t==='الحضور والغياب'||t==='الحضور'||t==='الغياب'||t.includes('import pdf')||t.includes('pdf import')||t.includes('استيراد pdf')||t.includes('استيراد امتحان pdf')){
                  el.style.setProperty('display','none','important');
                  el.setAttribute('aria-hidden','true');
                }
              });
            }
            hide();
            new MutationObserver(hide).observe(document.documentElement,{childList:true,subtree:true});
            setTimeout(hide,300);setTimeout(hide,1000);setTimeout(hide,2500);
          })();
          </script>'''
          s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "chatgpt-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove broken Create Exam interception"
          git push
