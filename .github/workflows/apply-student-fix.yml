name: Apply student controls fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "${{ !contains(github.event.head_commit.message, '[student-fix-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- STUDENT CONTROLS FINAL V11 -->'
          if marker in s: raise SystemExit(0)
          patch="<!-- STUDENT CONTROLS FINAL V11 -->\n<script id=\"student-controls-final-v11\">\n(function(){if(window.__studentControlsFinalV11)return;window.__studentControlsFinalV11=true;function students(){return (window.__teacherData&&window.__teacherData.students)||[]}function find(id){return students().find(function(x){return String(x.id)===String(id)})}document.addEventListener(\"click\",function(e){var b=e.target&&e.target.closest?e.target.closest(\"#hs-add,[data-hs],[data-he],[data-hr],[data-hd]\"):null;if(!b||!document.getElementById(\"teacherDashboard\"))return;e.preventDefault();e.stopImmediatePropagation();if(b.id===\"hs-add\"){if(window.hardStudentModal)window.hardStudentModal(null);return}if(b.dataset.hs){window.__hardStudentState={stage:b.dataset.hs,q:\"\"};var m=document.getElementById(\"teacherMain\");if(m&&window.renderStudentsHardRebuild)window.renderStudentsHardRebuild(m,window.__teacherData);return}if(b.dataset.he){var s=find(b.dataset.he);if(window.hardStudentModal)window.hardStudentModal(s);return}if(b.dataset.hr){if(window.manualRenewStudent)window.manualRenewStudent(Number(b.dataset.hr));return}if(b.dataset.hd){if(window.hardStudentDelete)window.hardStudentDelete(Number(b.dataset.hd));return}},true);document.addEventListener(\"input\",function(e){if(e.target&&e.target.id===\"hs-q\"&&document.getElementById(\"teacherDashboard\")){window.__hardStudentState={stage:(window.__hardStudentState&&window.__hardStudentState.stage)||\"all\",q:e.target.value||\"\"};var m=document.getElementById(\"teacherMain\");if(m&&window.renderStudentsHardRebuild)window.renderStudentsHardRebuild(m,window.__teacherData)}},true)})();\n</script>"
          s=s.replace('</body></html>',patch+'\n</body></html>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply student controls final fix [student-fix-applied]'
          git push