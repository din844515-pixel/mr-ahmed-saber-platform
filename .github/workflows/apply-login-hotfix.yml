name: Apply final login hotfix\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\npermissions:\n  contents: write\njobs:\n  patch:\n    if: github.actor != 'github-actions[bot]'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Append final login script\n        run: |\n          grep -q 'login-hotfix-final.js' index.html || printf '\\n<script src="/login-hotfix-final.js"></script>\\n' >> index.html\n      - name: Commit patch\n        run: |\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add index.html\n          git diff --cached --quiet || git commit -m 'Apply final login hotfix'\n          git push\n