name: Force Create Exam Clean

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply forced Create Exam patch
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[create-exam-force-clean]'; then
            exit 0
          fi
          python3 tools/force_create_exam.py
          git config user.name "chatgpt-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force Create Exam button clean handler [create-exam-force-clean]"
          git push
