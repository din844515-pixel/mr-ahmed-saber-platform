name: Final Clean Create Exam

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[create-exam-window-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install window-level Create Exam handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          patterns=[
            r'<script id="robust-create-exam-builder-v1">.*?</script>',
            r'<script id="robust-create-exam-builder-v2">.*?</script>',
            r'<script id="standalone-create-exam-v1">.*?</script>',
            r'<script id="standalone-create-exam-direct-v2">.*?</script>',
            r'<script id="create-exam-direct-final-fix">.*?</script>',
            r'<script id="create-exam-final-v[0-9]+">.*?</script>',
            r'<script id="create-exam-final-clean(?:-v[0-9]+)?">.*?</script>',
            r'<script id="exam-buttons-guaranteed-fix">.*?</script>',
            r'<!-- EXAMS BUTTONS DIRECT HOTFIX -->.*?</script>',
            r'<!-- EXAMS BUTTONS FINAL FIX -->.*?</script>',
          ]
          for pat in patterns:
            s=re.sub(pat,"",s,flags=re.S)

          s=re.sub(r'إنشاء الامتحان غير جاهز[^<]*',"",s)

          js=r'''<script id="create-exam-window-clean">
(function(){
  'use strict';
  function ar(){return (localStorage.getItem('platformLanguage')||'en')==='ar';}
  function closeBox(){var x=document.getElementById('ceWindowModal');if(x)x.remove();}
  function addQuestion(){
    var c=document.getElementById('ceWindowQs');if(!c)return;
    var n=c.children.length+1,d=document.createElement('div');
    d.style='border:1px solid #e3e8ef;border-radius:12px;padding:12px;margin:10px 0;background:#fff';
    d.innerHTML='<b>'+(ar()?'السؤال ':'Question ')+n+'</b>'+
      '<input class="cew-q input" style="width:100%;margin:6px 0" placeholder="'+(ar()?'نص السؤال':'Question text')+'">'+
      '<input class="cew-o input" style="width:100%;margin:4px 0" placeholder="A">'+
      '<input class="cew-o input" style="width:100%;margin:4px 0" placeholder="B">'+
      '<input class="cew-o input" style="width:100%;margin:4px 0" placeholder="C">'+
      '<input class="cew-o input" style="width:100%;margin:4px 0" placeholder="D">'+
      '<select class="cew-c input" style="width:100%;margin:5px 0"><option value="">'+(ar()?'الإجابة الصحيحة':'Correct answer')+'</option><option>A</option><option>B</option><option>C</option><option>D</option></select>'+
      '<button type="button" class="btn cew-rm">'+(ar()?'حذف السؤال':'Remove question')+'</button>';
    c.appendChild(d);
    d.querySelector('.cew-rm').onclick=function(){d.remove();};
  }
  async function save(){
    var m=document.getElementById('ceWindowMsg');
    var title=(document.getElementById('ceWindowTitle')?.value||'').trim();
    var grade=document.getElementById('ceWindowGrade')?.value||'';
    var dur=Number(document.getElementById('ceWindowDur')?.value||30);
    var show=document.getElementById('ceWindowShow')?.value==='true';
    var rows=[...document.querySelectorAll('#ceWindowQs>div')];
    if(!title){m.textContent=ar()?'اكتبي عنوان الامتحان.':'Enter the exam title.';return;}
    if(!grade){m.textContent=ar()?'اختاري المرحلة.':'Select the stage.';return;}
    if(!rows.length){m.textContent=ar()?'أضيفي سؤالًا واحدًا على الأقل.':'Add at least one question.';return;}
    if(!window.sb){m.textContent=ar()?'قاعدة البيانات غير متاحة.':'Database connection unavailable.';return;}
    m.textContent=ar()?'جاري إنشاء الامتحان...':'Creating exam...';
    try{
      var ex=await window.sb.rpc('teacher_create_exam',{p_title:title,p_grade:grade,p_duration_minutes:dur,p_show_answers:show});
      if(ex.error||!ex.data?.success)throw(ex.error||new Error(ex.data?.message||'Failed to create exam'));
      for(var i=0;i<rows.length;i++){
        var row=rows[i];
        var q=(row.querySelector('.cew-q')?.value||'').trim();
        var opts=[...row.querySelectorAll('.cew-o')].map(function(x){return (x.value||'').trim();});
        var correct=row.querySelector('.cew-c')?.value||null;
        if(!q)throw new Error((ar()?'السؤال رقم ':'Question ')+(i+1)+(ar()?' فارغ.':' is empty.'));
        var rr=await window.sb.rpc('teacher_add_exam_question',{p_exam_id:ex.data.exam_id,p_question_text:q,p_question_type:'mcq',p_points:1,p_correct_answer:correct,p_options:opts,p_grading_mode:'auto'});
        if(rr.error)throw rr.error;
      }
      closeBox();
      if(typeof window.refreshTeacher==='function')await window.refreshTeacher();
      alert(ar()?'تم إنشاء الامتحان بنجاح ✅':'Exam created successfully ✅');
    }catch(err){console.error('create-exam-window-clean',err);m.textContent=(ar()?'حدث خطأ: ':'Error: ')+(err?.message||err);}
  }
  function open(e){
    if(e){e.preventDefault();e.stopImmediatePropagation();e.stopPropagation();}
    closeBox();
    var b=document.createElement('div');b.id='ceWindowModal';
    b.style='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:14px';
    b.innerHTML='<div style="background:#fff;border-radius:18px;width:min(760px,100%);max-height:94vh;overflow:auto;padding:18px;direction:'+(ar()?'rtl':'ltr')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;color:#062b57">📝 '+(ar()?'إنشاء امتحان':'Create Exam')+'</h2><button id="ceWindowClose" type="button" class="btn">✕</button></div>'+
      '<div class="form-grid" style="margin-top:12px"><input id="ceWindowTitle" class="input" placeholder="'+(ar()?'عنوان الامتحان':'Exam Title')+'">'+
      '<select id="ceWindowGrade" class="input"><option value="">'+(ar()?'اختاري المرحلة':'Select Stage')+'</option><option>أولى إعدادي</option><option>ثانية إعدادي</option><option>ثالثة إعدادي</option><option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option><option>كورسات</option></select>'+
      '<input id="ceWindowDur" class="input" type="number" min="1" value="30">'+
      '<select id="ceWindowShow" class="input"><option value="false">'+(ar()?'إخفاء الإجابات':'Hide Answers')+'</option><option value="true">'+(ar()?'إظهار الإجابات':'Show Answers')+'</option></select></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><b>'+(ar()?'الأسئلة':'Questions')+'</b><button id="ceWindowAdd" type="button" class="btn gold">+ '+(ar()?'إضافة سؤال':'Add Question')+'</button></div>'+
      '<div id="ceWindowQs"></div><div id="ceWindowMsg" class="sub" style="margin-top:8px"></div>'+
      '<button id="ceWindowSave" type="button" class="submit" style="width:100%;margin-top:10px">✅ '+(ar()?'إنشاء الامتحان وحفظه':'Create Exam & Save')+'</button></div>';
    document.body.appendChild(b);
    document.getElementById('ceWindowClose').onclick=closeBox;
    document.getElementById('ceWindowAdd').onclick=addQuestion;
    document.getElementById('ceWindowSave').onclick=save;
    addQuestion();
  }
  window.__createExamWindowClean=open;
  window.__examCreateButton=open;

  function isCreate(el){
    if(!el)return false;
    var t=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
    return t.includes('create exam')||t.includes('إنشاء امتحان');
  }

  function wire(){
    document.querySelectorAll('button,a,[role="button"],.dash-action').forEach(function(el){
      if(!isCreate(el))return;
      el.disabled=false;
      el.style.pointerEvents='auto';
      el.onclick=function(e){return open(e);};
    });
  }

  // Window capture runs before document-level capture listeners that may swallow the click.
  window.addEventListener('click',function(e){
    var el=e.target&&e.target.closest?e.target.closest('button,a,[role="button"],.dash-action'):null;
    if(!isCreate(el))return;
    open(e);
  },true);

  window.addEventListener('pointerup',function(e){
    var el=e.target&&e.target.closest?e.target.closest('button,a,[role="button"],.dash-action'):null;
    if(!isCreate(el))return;
    if(!document.getElementById('ceWindowModal'))open(e);
  },true);

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire);else wire();
  new MutationObserver(wire).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(wire,300);setTimeout(wire,1000);setTimeout(wire,2500);

  // Replace common inline dashboard handlers with our clean function.
  s=s.replace(/onclick="return window\.__examCreateButton && window\.__examCreateButton\(event\)"/g,'onclick="return window.__createExamWindowClean(event)"');
  s=s.replace(/onclick="openCreateExam\(\)"/g,'onclick="return window.__createExamWindowClean(event)"');
})();
</script>'''

          s=s.replace('</body>',js+'</body>') if '</body>' in s else s+js
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit clean window-level handler
        run: |
          git config user.name "chatgpt-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Install window-level Create Exam handler [create-exam-window-clean]"
          git push
