name: Final Create Exam Button Override

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[create-exam-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Override broken Create Exam handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="create-exam-final-override"'
          if marker in s:
              raise SystemExit(0)
          js=r'''<script id="create-exam-final-override">
          (function(){
            function openFixed(e){
              if(e){e.preventDefault();e.stopImmediatePropagation();}
              if(typeof window.__robustOpenCreateExam==='function'){
                return window.__robustOpenCreateExam(e);
              }
              if(typeof window.openCreateExam==='function' && window.openCreateExam!==openFixed){
                return window.openCreateExam(e);
              }
              alert('إنشاء الامتحان لم يكتمل تحميله. حدّثي الصفحة وحاولي مرة أخرى.');
              return false;
            }
            window.__examCreateButton=openFixed;
            window.openCreateExam=openFixed;
            function wire(){
              document.querySelectorAll('button,a,[role="button"],.dash-action').forEach(function(el){
                var t=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
                if(t.indexOf('create exam')<0 && t.indexOf('إنشاء امتحان')<0) return;
                el.disabled=false;
                el.style.pointerEvents='auto';
                el.onclick=openFixed;
              });
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire);else wire();
            new MutationObserver(wire).observe(document.documentElement,{childList:true,subtree:true});
            setTimeout(wire,300);setTimeout(wire,1000);setTimeout(wire,2500);
          })();
          </script>'''
          s=s.replace('</body>',js+'</body>') if '</body>' in s else s+js
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final fix
        run: |
          git config user.name "chatgpt-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Final Create Exam button override [create-exam-final]"
          git push
