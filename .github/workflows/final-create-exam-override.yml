name: Final Create Exam Button Override

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[create-exam-v4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Override broken Create Exam handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          # Remove every stale Create Exam v2/fallback handler before adding the final bridge.
          s=re.sub(r'<script id="robust-create-exam-builder-v2">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script id="robust-create-exam-builder-v1">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'إنشاء الامتحان غير جاهز، حدّثي الصفحة مرة أخرى.', '', s)
          marker='id="create-exam-final-v5"'
          if marker in s:
              p.write_text(s,encoding='utf-8')
              raise SystemExit(0)
          js=r'''<script id="create-exam-final-v5">
          (function(){
            'use strict';
            function isCreate(el){
              if(!el) return false;
              var t=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
              return t.indexOf('create exam')>=0 || t.indexOf('إنشاء امتحان')>=0;
            }
            function openDirect(e){
              if(e){e.preventDefault();e.stopImmediatePropagation();e.stopPropagation();}
              var fn=window.__robustOpenCreateExam;
              if(typeof fn==='function') return fn(e);
              var fn2=window.__standaloneOpenExamDirect||window.__standaloneOpenExam;
              if(typeof fn2==='function') return fn2(e);
              return false;
            }
            function wire(){
              document.querySelectorAll('button,a,[role="button"],.dash-action').forEach(function(el){
                if(!isCreate(el)) return;
                el.disabled=false;
                el.style.pointerEvents='auto';
                el.onclick=openDirect;
              });
            }
            document.addEventListener('click',function(e){
              var el=e.target&&e.target.closest?e.target.closest('button,a,[role="button"],.dash-action'):null;
              if(isCreate(el)) openDirect(e);
            },true);
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire);else wire();
            new MutationObserver(wire).observe(document.documentElement,{childList:true,subtree:true});
            setTimeout(wire,300);setTimeout(wire,1000);setTimeout(wire,2500);
          })();
          </script>'''
          s=s.replace('</body>',js+'</body>') if '</body>' in s else s+js
          import re
          s=re.sub(r'<!-- CREATE-EXAM-CAPTURE-FIX-2026-09-30 -->.*?</script>', '', s, count=1, flags=re.S)
          s=re.sub(r'<script id="create-exam-final-override">.*?</script>', '', s, count=1, flags=re.S)
          # Remove the stale v2 handler that overwrites the working v1 Create Exam button.
          s=re.sub(r'<script id=\\?"robust-create-exam-builder-v2\\?">.*?</script>', '', s, count=1, flags=re.S)
          s=s.replace('<script id=\\"robust-create-exam-builder-v2\\">','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final fix
        run: |
          git config user.name "chatgpt-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove stale Create Exam v2 and install clean bridge [create-exam-v5]"
          git push
